# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Line 1: where you are and git, then whatever else applies ($all = every other
# module, each shown only when relevant: languages, aws, kubernetes, duration).
# Line 2: the prompt character.
format = """
$username\
$hostname\
$directory\
${custom.git_server}\
$git_branch\
$git_commit\
$git_state\
$git_status\
$all\
$line_break\
$jobs\
$battery\
$character"""

# Fail fast instead of hanging the prompt in a huge repo or on a slow tool
command_timeout = 800

################################################################################
## Custom Commands
################################################################################
[custom.git_server]
#disabled = true
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
shell = ["bash", "--noprofile", "--norc"]
# require_repo lets Starship check for a repo itself, instead of starting
# another bash + git (`when = git rev-parse ...`) on every prompt.
require_repo = true
when = true
style = "white"
format = '[$output]($style) '

[custom.git_scope]
disabled = true
command = '''
printf "%s (%s)" \
  "$(if [ -n "$GIT_AUTHOR_EMAIL" ]; then echo "$GIT_AUTHOR_EMAIL"; else git config user.email; fi)" \
  "$(if [ -n "$GIT_AUTHOR_NAME" ]; then echo "$GIT_AUTHOR_NAME"; else git config user.name; fi)"
'''
description = 'The currently configured Git user.{email,name}'
format = '$output '
style = 'blue bold'
when = 'git rev-parse --is-inside-work-tree'

[custom.git_last_commit]
disabled = true
description = "Display last commit hash and message"
command = "git show -s --format='%h \"%s\"'"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
style = "bright-yellow bold"
format = "[$output]($style) "

[custom.ssh_no_keys]
disabled = true
description = "SSH missing keys"
when = "ssh-add -l | grep -q 'no identities'"
command = "echo 🚫"
format = '\[$symbol[$output]($style)\]'
shell = ["bash", "--noprofile", "--norc"]
symbol = "🔑"
style = "bold fg:red"

[custom.ssh_keys]
disabled = true
description = "SSH key count"
when = "ssh-add -l | grep -v -q 'no identities'"
command = "ssh-add -l | grep -v 'no identities' | wc -l"
format = '\[$symbol[$output]($style)\]'
shell = ["bash", "--noprofile", "--norc"]
symbol = "🔑"
style = "bold fg:green"

################################################################################
## Shell
################################################################################
[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 30
style = "bold red"

[cmd_duration]
min_time = 2_000  # show how long a command took when it ran over 2 seconds
format = '\[[⏱ $duration]($style)\]'
style = 'yellow'

[time]
time_format = "%T"
format = "🕙 $time($style) "
style = "bright-white"
disabled = true

[username]
format = '\[[$user]($style)\]'
style_user = "bold dimmed blue"
show_always = false

[hostname]
ssh_only = false
format = "<[$hostname]($style)>"
trim_at = "-"
style = "bold dimmed white"
disabled = true

[directory]
truncation_length = 5
format = "[$path]($style)[$lock_symbol]($lock_style) "

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

################################################################################
## GIT
################################################################################
[git_branch]
format = '\[[$symbol$branch]($style)\]'
# symbol: Starship's default Nerd Font branch icon
style = "bold green"

[git_state]
format = '\[[\($state( $progress_current of $progress_total)\)]($style)\]'

# One-character symbols, colored by meaning (single-width, so the prompt
# doesn't jump around the way double-width emoji did):
#   + staged  ! modified  ? untracked  ✘ deleted  » renamed  $ stashed
#   = conflicts  ⇡ ahead  ⇣ behind
[git_status]
conflicted = '[=$count](bold red)'
ahead = '[⇡$count](green)'
behind = '[⇣$count](yellow)'
diverged = '[⇡$ahead_count⇣$behind_count](bold yellow)'
untracked = '[?$count](cyan)'
stashed = '[\$$count](purple)'
modified = '[!$count](yellow)'
staged = '[+$count](green)'
renamed = '[»$count](blue)'
deleted = '[✘$count](red)'
format = '(\[$all_status$ahead_behind\])'

[git_commit]
commit_hash_length = 8
style = "bold white"
tag_symbol = '🔖 '
disabled = false

################################################################################
## Languages & Tools
################################################################################
# Shows the profile awslogin exported (AWS_PROFILE); hidden when none is set.
# The symbol is literal text so the whole group disappears without a profile
# (AWS_REGION alone, which aws.zsh always exports, would otherwise show it).
[aws]
format = '(\[[☁️ $profile]($style)\])'
style = "bold yellow"

[bun]
